name: Android CI

on:
  push:
    branches: [ main ]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# contents:write is needed by the release-publishing step (tag pushes only).
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK + run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: upscaler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ---- Signed release APK (pushes only; fork PRs have no secrets) ----
      - name: Decode signing keystore
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Remove decoded keystore
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # APK asset naming MUST stay in sync with AppUpdater.apkUrlFor() in
      # app/src/main/java/com/devfahim/upscaler/util/AppUpdater.kt:
      #   releases/download/<tag>/Upscaler-<tag>-release.apk
      - name: Rename APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release-out
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            label="${GITHUB_REF_NAME}"
          else
            label="ci-${GITHUB_SHA::7}"
          fi
          cp "$apk" "release-out/Upscaler-${label}-release.apk"

      - name: Upload release APK artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: upscaler-release-apk
          path: release-out/*.apk
          retention-days: 14
          if-no-files-found: error

      # Pushing a v* tag publishes a GitHub Release with the signed APK and
      # the full changelog (RELEASE_NOTES.md). Branch pushes only verify the
      # build and upload the artifact.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Upscaler ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-out/*.apk
