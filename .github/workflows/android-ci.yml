name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK + run unit tests
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build.log
        continue-on-error: true

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        run: |
          LN=$(grep -n "FAILURE: Build failed" build.log | head -1 | cut -d: -f1)
          if [ -z "$LN" ]; then
            LN=$(grep -n "^e: " build.log | head -1 | cut -d: -f1)
          fi
          if [ -z "$LN" ]; then
            LN=1
          fi
          tail -n +"$LN" build.log | head -120 > errors.txt
          i=0
          while IFS= read -r line; do
            i=$((i+1))
            if [ $i -gt 40 ]; then break; fi
            esc=$(printf '%s' "$line" | sed 's/%/%25/g')
            echo "::error::${esc}"
          done < errors.txt
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: upscaler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
