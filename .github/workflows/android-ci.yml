name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK + run unit tests
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build.log
        continue-on-error: true

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -nE "error:|error: |e: file|FAILURE:|FAILED$|What went wrong|Execution failed|Caused by|> Task" build.log | tail -60 > errors.txt || true
          if [ ! -s errors.txt ]; then
            tail -80 build.log > errors.txt
          fi
          while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g' | tr '\n' ' ')
            echo "::error::${esc}"
          done < errors.txt
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: upscaler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
